<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飛行機レース (トゥーン調)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Arial Black', sans-serif; }
        /* 🛠 操作パネルを横並びにするスタイル */
        #ui {position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.85); color: white; padding: 15px; border-radius: 8px; display: flex; gap: 10px; flex-wrap: wrap; max-width: 960px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .ship-config {background: rgba(255,255,255,0.05); padding: 10px; border-radius: 4px; width: 210px; border-bottom: none; }
        .ship-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #00ffcc; border-left: 4px solid #00ffcc; padding-left: 8px; display: flex; align-items: center; }
        .name-input { background: transparent; border: none; border-bottom: 1px dashed #00ffcc; color: #00ffcc; font-weight: bold; font-size: 13px; width: 120px; margin-left: 5px; outline: none; font-family: inherit; }
        .input-group { margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }
        .input-group label { font-size: 10px; width: 130px; color: #ddd; }
        .input-group input[type="number"] { width: 50px; background: #222; color: #fff; border: 1px solid #555; border-radius: 3px; padding: 2px; font-size: 11px; text-align: right; }
        /* ⏱️ タイム＆リザルト表示 */
        #info {position: absolute; bottom: 10px; left: 10px; color: white; font-size: 14px; text-shadow: 2px 2px 4px black; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px; z-index: 200; min-width: 220px; border: 1px solid rgba(255,255,255,0.2); line-height: 1.6; }
        #showcaseUI { display: none; position: absolute; bottom: 100px; right: 50px; color: white; background: rgba(0,0,0,0.85); padding: 20px; border-radius: 15px; border-right: 12px solid #ffd700; z-index: 400; min-width: 280px; box-shadow: -5px 5px 20px rgba(0,0,0,0.5); }
        #showcaseName { font-size: 28px; margin: 0; color: #ffd700; }
        #showcaseSpeed { font-size: 50px; margin: 0; font-family: 'Impact', sans-serif; }
        #countdownUI { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 180px; font-weight: bold; z-index: 350; text-shadow: 0 0 30px #000; }
        #confetti-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 250; overflow: hidden; }
        .confetti { position: absolute; width: 12px; height: 12px; border-radius: 2px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(800px) rotate(720deg); opacity: 0; } }
        /* 🏆 豪華な勝利画面のスタイル */
        #winnerUI {display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; color: white; text-align: center; }
        #winnerCloseUp {width: 60%; height: 60%; margin-bottom: 20px; position: relative; } 
        #winnerMessage {font-size: 60px; margin-bottom: 10px; animation: pulseMessage 2s ease-in-out infinite; font-weight: bold; color: #ffd700; text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8); }
        #winnerText {background: none; -webkit-background-clip: unset; -webkit-text-fill-color: unset; display: inline; }
        #praiseMessage {font-size: 30px; color: #00e5ff; margin-bottom: 30px; font-family: sans-serif; text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8); }
        #restartBtn_winner {background: #00ffcc; border: none; border-radius: 4px; padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; color: black; box-shadow: 0 0 10px rgba(0,255,204,0.5); }
        @keyframes pulseMessage {0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.9; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

            <div class="input-group" style="display: none;"><label>機体重量 (トン):</label><input type="number" id="weight3" value="100"></div>
            <div class="input-group"><label>揚抗比 (L/D):</label><input type="number" id="ld_3" value="15.0" step="0.1"></div>
        </div>
        <div class="ship-config">
            <div class="ship-title">✈️ <input type="text" id="name4" value="チーム きいろ" class="name-input"></div>
            <input type="file" id="upload4" accept=".glb,.gltf" style="width: 100%; font-size: 10px;"><br>
            <div class="input-group" style="display: none;"><label>離陸決定速度 (V1):</label><input type="number" id="v1_4" value="120"></div>
            <div class="input-group" style="display: none;"><label>機首上げ速度 (VR):</label><input type="number" id="vr_4" value="120"></div>
            <div class="input-group" style="display: none;"><label>機体重量 (トン):</label><input type="number" id="weight4" value="100"></div>
            <div class="input-group"><label>揚抗比 (L/D):</label><input type="number" id="ld_4" value="15.0" step="0.1"></div>
        </div>
    </div>
    <button id="startBtn" style="position: fixed; top: 20px; right: 20px; width: auto; z-index: 1000; padding: 10px 20px; font-size: 16px; background: linear-gradient(to bottom, #ffaa00, #ff8800); color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">フライト開始 🏁</button>
    <div id="showcaseUI"><p id="showcaseName"></p><p style="margin:0;font-size:12px;color:#ccc;">PERFORMANCE SPEED</p><p id="showcaseSpeed"></p></div>
    <div id="countdownUI"></div>
    <div id="confetti-container"></div>
    <div id="winnerUI">
        <div id="winnerCloseUp"></div>
        <div id="winnerMessage"><span id="winnerText"></span> </div>
        <div id="praiseMessage">見事なフライトでした！</div>
        <button id="restartBtn_winner">RETRY 🔄</button>
    </div>
    <div id="info">
        ⏱️ TIME: <span id="timeTxt">0.00</span>s<br>
        <span id="infoName1">RED</span>: <span id="status1">READY</span><br>
        <span id="infoName2">GREEN</span>: <span id="status2">READY</span><br>
        <span id="infoName3">BLUE</span>: <span id="status3">READY</span><br>
        <span id="infoName4">YELLOW</span>: <span id="status4">READY</span><br>
    </div>

    <audio id="countSound" src="countdown.mp3" preload="auto" loop></audio>
